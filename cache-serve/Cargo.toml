[package]
name = "nix-cache-serve"
version = "0.1.0"
edition = "2021"
description = "Read-only per-file endpoint in front of a Nix binary cache"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
mime_guess = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "io-util",
  "net",
  "signal",
  "sync",
] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.async-compression]
version = "0.4"
features = ["tokio", "zstd", "xz", "bzip2", "brotli"]

[dependencies.reqwest]
version = "0.12"
features = ["stream"]

[profile.release]
lto = "thin"
